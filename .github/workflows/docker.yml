name: Build and Push to Docker Hub

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Войти в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Настроить Buildx
        uses: docker/setup-buildx-action@v3

      - name: Сформировать теги образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ai-app
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=ref,event=tag

      - name: Собрать и опубликовать образ
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-dev:
    name: Simulated deploy-dev on GitHub runner
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Войти в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Деплой проверенного SHA-образа на runner
        env:
          IMAGE_REF: ${{ secrets.DOCKERHUB_USERNAME }}/ai-app:sha-${{ github.sha }}
        run: |
          chmod +x ./deploy.sh
          echo "Deployment runs on this GitHub Actions runner, not on the local VM."
          ./deploy.sh dev 8020 "$IMAGE_REF"
          docker inspect --format='container={{.Name}} image={{.Image}} env={{.Config.Env}}' ai-dev
          curl -fsS http://127.0.0.1:8020/health
